<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My reports | FixIt</title>
  <!-- Font: Inter, an open typeface designed for screens -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <!-- Load order matters: tokens first, components last -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="site-header">
    <div class="site-header-inner">
      <a class="back-link" href="index.html">&larr; Back</a>
      <a class="logo" href="index.html">FixIt</a>
    </div>
  </header>

  <main id="main" class="page">
    <h1>My reports</h1>
    <p class="lede">Reports you've sent with your email address. Anonymous reports don't appear here.</p>

    <!-- Same summary pattern as review.html, reused for a list of reports -->
    <section class="summary" aria-labelledby="rep-1">
      <h2 class="summary-heading" id="rep-1">FX-20481</h2>
      <p class="summary-content">Broken streetlight<br>24 Queen Street, Auckland Central</p>
      <span class="summary-edit badge">Received</span>
    </section>

    <section class="summary" aria-labelledby="rep-2">
      <h2 class="summary-heading" id="rep-2">FX-19876</h2>
      <p class="summary-content">Pothole or road damage<br>Karangahape Road, near the bridge</p>
      <span class="summary-edit badge">Fixed</span>
    </section>

    <a class="btn btn-primary btn-block" href="index.html">Report a new issue</a>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
